<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat</title>
<style>
body{font-family:sans-serif;background:#111;color:#eee;margin:0;display:flex;flex-direction:column;height:100vh}
.top{display:flex;align-items:center;gap:10px;padding:12px;background:#1c1c1c}
.top a{color:#e91e63;text-decoration:none;font-size:20px}
#msgs{flex:1;overflow-y:auto;padding:12px}
.m{max-width:75%;margin:6px 0;padding:8px 12px;border-radius:14px;background:#2a2a2a;word-wrap:break-word}
.me{margin-left:auto;background:#e91e63}
.bar{display:flex;gap:8px;padding:10px;background:#1c1c1c}
.bar input{flex:1;padding:12px;border-radius:8px;border:0;background:#2a2a2a;color:#eee;font-size:16px}
.bar button{padding:12px 18px;border-radius:8px;border:0;background:#e91e63;color:#fff;font-weight:bold;font-size:16px}
</style>
</head>
<body>
<div class="top">
  <a href="home.html">&larr;</a>
  <b id="who">Chat</b>
</div>
<div id="msgs"></div>
<div class="bar">
  <input id="text" placeholder="Type a message" maxlength="1000">
  <button id="send">Send</button>
</div>
<script type="module" src="chat.js"></script>
</body>
</html>
