<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meetup</title>
<style>
body{font-family:sans-serif;background:#111;color:#eee;margin:0;padding:20px}
.wrap{max-width:380px;margin:0 auto}
.card{background:#1c1c1c;padding:20px;border-radius:14px;margin:16px 0}
input,button{width:100%;padding:12px;margin:6px 0;border-radius:8px;border:0;font-size:16px;box-sizing:border-box}
input{background:#2a2a2a;color:#eee}
button{background:#e91e63;color:#fff;font-weight:bold}
button.s{background:#333}
button.l{background:none;color:#aaa;font-weight:normal;text-decoration:underline}
h3{margin:0 0 8px}
#msg{min-height:20px;font-size:14px;color:#ff8a80}
.hide{display:none}
</style>
</head>
<body>
<div class="wrap">
  <h2>Meetup</h2>
  <p id="msg"></p>

  <div id="loginBox" class="hide">
    <div class="card">
      <h3>New here?</h3>
      <input id="newEmail" type="email" placeholder="Your Gmail address" autocomplete="email">
      <input id="newPass" type="password" placeholder="Create a password (min 6)" autocomplete="new-password">
      <button id="signupBtn">Continue with new Gmail</button>
    </div>
    <div class="card">
      <h3>Already have an account?</h3>
      <input id="oldEmail" type="email" placeholder="Registered Gmail address" autocomplete="email">
      <input id="oldPass" type="password" placeholder="Your password" autocomplete="current-password">
      <button class="s" id="loginBtn">Log in</button>
      <button class="l" id="forgotBtn">Forgot password?</button>
    </div>
  </div>

  <div id="verifyBox" class="hide card">
    <h3>Verify your email</h3>
    <p>We sent a verification link to <b id="vEmail"></b>. Open your email, tap the link, then come back here and tap the button below. Check your spam folder too.</p>
    <button id="checkBtn">I have verified my email</button>
    <button class="s" id="resendBtn">Resend link</button>
    <button class="l" id="backBtn">Use a different email</button>
  </div>

  <div id="ageBox" class="hide card">
    <p>One last step. You must be 18 or older.</p>
    <input id="name" placeholder="Your name">
    <label>Date of birth</label>
    <input id="dob" type="date">
    <button id="ageBtn">Continue</button>
  </div>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
